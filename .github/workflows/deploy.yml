name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SHARP_FORCE_BUNDLE_LIBVIPS: "1"
  SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  build:
    name: Build Astro SSG
    runs-on: ubuntu-latest
    steps:
      - name: "1. Checkout репозитория"
        uses: actions/checkout@v4

      - name: "2. Информация об окружении (diagnostic)"
        run: |
          echo "OS: $(cat /etc/os-release | head -2)"
          echo "RAM: $(free -h | grep Mem)"
          node -v
          npm -v
          ls -la src/data src/data/technique 2>&1 | head -20

      - name: "3. Установка Node.js 20 (LTS — 100% stable)"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: "4. Системные библиотеки для Sharp/libvips"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvips-dev build-essential pkg-config || true

      - name: "5. Установка зависимостей (npm install вместо ci — надёжно!)"
        run: npm install --engine-strict=false --no-audit --no-fund --prefer-offline

      - name: "6. Сборка сайта Astro SSG"
        run: npm run build

      - name: "7. Проверка билда (diagnostic)"
        run: |
          ls -la dist | head -20
          echo "Total pages: $(find dist -name '*.html' -type f | wc -l)"
          echo "Check index.html:"
          head -c 500 dist/index.html 2>&1 || echo "index not found"

      - name: "8. Загрузка артефакта GitHub Pages"
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy в GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
